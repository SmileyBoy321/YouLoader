name: Release

# Push a tag like v2.2.0 to build YouLoader.exe and the Android APKs from that exact commit
# and publish them together on the Releases page.
# The website's download button always points at the newest release's YouLoader.exe,
# and the Android app's update check only offers releases that contain an APK.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test --filter "Category!=Integration"

      - name: Publish YouLoader.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/YouLoader -c Release -o dist -p:Version=$version
          $hash = (Get-FileHash dist/YouLoader.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  YouLoader.exe" | Out-File dist/YouLoader.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/YouLoader.exe
            dist/YouLoader.exe.sha256

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every release must be signed with the same key, or phones refuse to install it over the previous one.
      # The key lives only in the repository's secrets (Settings → Secrets and variables → Actions).
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are missing, so the APKs can't be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/youloader-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/youloader-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=youloader"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Unit tests and signed APKs
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion=${{ github.ref_name }}

      # One APK per CPU type keeps each download around 55 MB instead of 200 MB.
      - name: Name and check the APKs
        run: |
          out=app/build/outputs/apk/release
          mkdir -p ../dist
          cp $out/app-arm64-v8a-release.apk   ../dist/YouLoader.apk         # almost every phone since 2017
          cp $out/app-armeabi-v7a-release.apk ../dist/YouLoader-32bit.apk   # older phones
          cp $out/app-x86_64-release.apk      ../dist/YouLoader-x86_64.apk  # emulators and Chromebooks
          apksigner=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for apk in ../dist/*.apk; do $apksigner verify "$apk"; done
          cd ../dist && sha256sum *.apk > YouLoader-android.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/YouLoader-android.sha256

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums for the release notes
        run: |
          echo "EXE_SHA256=$(cut -d' ' -f1 dist/YouLoader.exe.sha256)" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(grep ' YouLoader.apk$' dist/YouLoader-android.sha256 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouLoader.exe
            dist/YouLoader.exe.sha256
            dist/YouLoader.apk
            dist/YouLoader-32bit.apk
            dist/YouLoader-x86_64.apk
            dist/YouLoader-android.sha256
          generate_release_notes: true
          body: |
            ### Windows: download `YouLoader.exe`
            One portable file: no installer, nothing else to install.
            SHA-256: `${{ env.EXE_SHA256 }}`

            Windows may show “Windows protected your PC” because the app isn't code-signed yet. Click **More info**, then **Run anyway**.

            ### Android: download `YouLoader.apk`
            For Android 7 and newer. Open the file on your phone and allow installing apps from your browser when Android asks.
            SHA-256: `${{ env.APK_SHA256 }}`

            `YouLoader-32bit.apk` is for older phones that can't install the main one, and `YouLoader-x86_64.apk` for emulators and Chromebooks. All checksums are in `YouLoader-android.sha256`.
