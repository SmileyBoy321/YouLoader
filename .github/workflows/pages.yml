name: Website

# Builds the landing page and publishes it for free on GitHub Pages:
# https://smileyboy321.github.io/YouLoader/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# To use your own domain later, set a repository variable SITE_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "src/YouLoader/YouLoader.csproj"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the sitemap gets real last-modified dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
        run: |
          python website/build.py
          python website/test_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

      - id: deployment
        uses: actions/deploy-pages@v4
